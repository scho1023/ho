<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>經典貪食蛇</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; }
        #score { font-size: 20px; margin-bottom: 10px; }
        canvas {
            border: 3px solid #4bc0c8;
            background-color: #0f0f12;
            box-shadow: 0 0 20px rgba(75, 192, 200, 0.3);
        }
    </style>
</head>
<body>

    <h1>🐍 網頁版貪食蛇</h1>
    <div id="score">分數：0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameStarted = false;

        document.addEventListener("keydown", changeDirection);

        function gameLoop() {
            moveSnake();
            if (checkGameOver()) {
                alert(`遊戲結束！你的最終得分是：${score}`);
                resetGame();
                return;
            }
            clearCanvas();
            drawFood();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#0f0f12";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#4bc0c8";
            snake.forEach((part, index) => {
                // 蛇頭顏色稍微深一點區分
                if (index === 0) ctx.fillStyle = "#2b939b";
                else ctx.fillStyle = "#4bc0c8";
                
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ff4757";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // 吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = "分數：" + score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // 確保食物不會生在蛇身上
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;
            const W = 87, A = 65, S = 83, D = 68;

            // 第一次按方向鍵時才啟動遊戲循環
            if (!gameStarted && [LEFT, UP, RIGHT, DOWN, W, A, S, D].includes(keyPressed)) {
                gameStarted = true;
                gameInterval = setInterval(gameLoop, 100);
            }

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((keyPressed === LEFT || keyPressed === A) && !goingRight) { dx = -1; dy = 0; }
            if ((keyPressed === UP || keyPressed === W) && !goingDown) { dx = 0; dy = -1; }
            if ((keyPressed === RIGHT || keyPressed === D) && !goingLeft) { dx = 1; dy = 0; }
            if ((keyPressed === DOWN || keyPressed === S) && !goingUp) { dx = 0; dy = 1; }
        }

        function checkGameOver() {
            const head = snake[0];
            // 撞牆檢查
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            // 撞到自己檢查
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        function resetGame() {
            clearInterval(gameInterval);
            snake = [{ x: 10, y: 10 }];
            food = { x: 15, y: 15 };
            dx = 0;
            dy = 0;
            score = 0;
            gameStarted = false;
            scoreElement.innerText = "分數：" + score;
            clearCanvas();
            drawFood();
            drawSnake();
        }

        // 初始化畫面
        clearCanvas();
        drawFood();
        drawSnake();
    </script>
</body>
</html>
